<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mister Boss</title>
<meta name="theme-color" content="#1f6b40">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="outfit.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Outfit";src:url("outfit.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{
  --ink:#10241a; --ink2:#2f4a3b; --mut:#647a6d; --mut2:#a3b8ab;
  --glass:rgba(255,255,255,.62); --glass2:rgba(255,255,255,.82); --gline:rgba(255,255,255,.9); --gshade:rgba(0,0,0,.18);
  --blue:#2b8f55; --blue2:#45b073; --deep:#164f30; --ice:#eef7f1; --frost:#d3eadb;
  --teal:#2b8f55; --neon:#e0a526;
  --c-blue:#2b8f55; --c-green:#1e8a4a; --c-orange:#c98a12; --c-red:#c62839; --c-purple:#5a6f63; --c-yellow:#b07d00;
  --pos:#1e8a4a; --neg:#c62839; --edge2:rgba(0,0,0,.12);
  --f:'Outfit','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{color:var(--ink);font:15px/1.42 var(--f);min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom));background:#e9e9e9}
/* fundo: pista de gelo azul, desfocada, com luz por cima (como a referência) */
body:before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:#0f3a24 url("bg.webp") center top / cover no-repeat;transform:translateZ(0)}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(236,245,239,0) 22%,rgba(236,245,239,.6) 22%,rgba(238,246,240,.93) 34%,#edf5ef 100%)}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--blue)}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
svg.i{width:1.15em;height:1.15em;vertical-align:-.2em;flex:0 0 auto}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--gline);box-shadow:0 10px 30px var(--gshade),inset 0 1px 0 rgba(255,255,255,.9)}
/* topo */
.top{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 0 4px;background:linear-gradient(180deg,rgba(9,40,24,.8),rgba(9,40,24,.25) 75%,rgba(9,40,24,0));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top .r1{display:flex;align-items:center;gap:10px;max-width:720px;margin:0 auto;padding:0 16px 6px}
.top .face{width:46px;height:46px;flex:0 0 46px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.brand{font:300 1.55rem/1 var(--f);color:#fff;letter-spacing:-.01em;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.brand b{font-weight:800}
.brand small{display:block;font:500 .6rem/1.5 var(--f);letter-spacing:.22em;white-space:nowrap;color:rgba(255,255,255,.82);text-transform:uppercase}
.grow{flex:1}
.ibtn{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.25rem;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 16px rgba(0,0,0,.25)}
.ibtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stats{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 6px;scrollbar-width:none;max-width:720px;margin:0 auto}
.stats::-webkit-scrollbar{display:none}
.st{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.26);border:1px solid rgba(255,255,255,.6);border-radius:999px;padding:4px 11px 4px 8px;font:600 .84rem var(--f);color:#fff;white-space:nowrap;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.st svg{color:#fff;opacity:.9}
.upd{font:400 .74rem var(--f);color:rgba(255,255,255,.88);padding:0 16px 4px;max-width:720px;margin:0 auto}
/* navegação: pílula de vidro a flutuar */
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:flex;gap:2px;width:min(94vw,560px);padding:6px;border-radius:30px;background:rgba(255,255,255,.66);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid rgba(255,255,255,.9);box-shadow:0 14px 34px rgba(0,0,0,.25)}
#nav button{flex:1;position:relative;background:none;border:0;border-radius:24px;color:var(--mut);font:600 .7rem var(--f);min-height:56px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
#nav svg{width:24px;height:24px}
#nav button.on{color:#fff;background:linear-gradient(180deg,var(--blue2),var(--blue));box-shadow:0 6px 14px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.4)}
#nav .nb{position:absolute;top:4px;right:calc(50% - 22px);background:var(--neon);color:#fff;border-radius:999px;font:700 .64rem/1 var(--f);padding:3px 6px}
/* painéis de vidro */
.pn{position:relative;background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--gline);border-radius:24px;margin:12px 0;padding:14px 16px;box-shadow:0 10px 30px var(--gshade),inset 0 1px 0 rgba(255,255,255,.9)}
.pn.hl{background:var(--glass2)}
.pn-h{font:600 1.18rem/1.15 var(--f);margin:0 0 4px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.pn-h svg{color:var(--blue)}
.pn-h .r{margin-left:auto;font:400 .78rem var(--f);color:var(--mut)}
.div{height:1px;margin:6px 0 10px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.14),transparent)}
.muted{color:var(--mut)} .small{font-size:.82rem} .pos{color:var(--pos)} .neg{color:var(--neg)}
/* separadores (pílulas, como «Movements / Game Starts») */
.tabs{display:flex;gap:4px;margin:12px 0 0;padding:4px;border-radius:999px;background:rgba(255,255,255,.5);border:1px solid var(--gline);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 6px 18px var(--gshade)}
.tabs button{flex:1;border:0;background:none;border-radius:999px;padding:9px 6px;font:500 .9rem var(--f);color:var(--ink2);cursor:pointer;min-height:40px}
.tabs button.on{background:linear-gradient(180deg,var(--blue2),var(--blue));color:#fff;box-shadow:0 6px 14px rgba(0,0,0,.35)}
/* faixa de datas */
.dates{display:flex;gap:7px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dates button{flex:0 0 62px;height:76px;border-radius:18px;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:300 1.2rem/1 var(--f)}
.dates button small{font:500 .6rem var(--f);text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);text-align:center;line-height:1.15}
.dates button.on{background:#fff;color:var(--blue);font-weight:700;box-shadow:0 8px 18px rgba(0,0,0,.2)}
.dates button.on b{display:flex;width:36px;height:36px;border-radius:50%;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--blue2),var(--blue));color:#fff;font:700 1.05rem var(--f)}
.dates button b{font-weight:inherit}
/* categorias e barras */
.cat{display:flex;align-items:center;gap:8px;font:600 .92rem var(--f);margin:16px 0 8px;color:var(--ink)}
.cat svg{color:var(--k,var(--blue));width:19px;height:19px}
.at{margin:0 0 11px}
.at .l{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;color:var(--ink2);margin-bottom:5px}
.at .v{font:700 .98rem var(--f);white-space:nowrap;color:var(--ink)}
.at .v small{font-weight:400;color:var(--mut)}
.bar{height:8px;border-radius:999px;background:rgba(0,0,0,.09);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--k,var(--blue))}
.bar.two i+i{left:auto;right:0}
/* números grandes em mosaico (81% · 78% · 92%) */
.ovr{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:52px;padding:6px 8px;border-radius:16px;background:rgba(255,255,255,.75);border:1px solid var(--gline);line-height:1;box-shadow:0 4px 12px var(--gshade)}
.ovr b{font:700 1.3rem/1 var(--f);color:var(--ink)}
.ovr small{font:500 .58rem var(--f);letter-spacing:.08em;color:var(--mut);margin-top:2px}
.big-ovr{display:flex;align-items:center;gap:12px}
.big-ovr .t{font:500 1rem var(--f)}
.big-ovr .n{font:700 2.4rem/1 var(--f);padding:6px 16px;border-radius:20px;background:#fff;color:var(--blue);box-shadow:0 8px 20px var(--gshade)}
.ruler{display:none}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font:500 .95rem var(--f);border:1px solid var(--gline);border-radius:999px;background:rgba(255,255,255,.62);padding:10px 16px;min-height:46px;cursor:pointer;color:var(--ink);box-shadow:0 4px 12px var(--gshade)}
.btn:active{transform:translateY(1px)}
.btn.go{color:var(--blue);background:rgba(255,255,255,.82)}
.btn.fill{background:linear-gradient(180deg,var(--blue2),var(--blue));color:#fff;border-color:rgba(255,255,255,.4);box-shadow:0 8px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.red{color:var(--neg);background:rgba(255,255,255,.75)}
.btn.full{width:100%}
.btn.sm{min-height:34px;padding:5px 12px;font-size:.8rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;align-items:center}
.row.w{flex-wrap:wrap}
/* herói (como «Advance Your Game») */
.hero{position:relative;overflow:hidden;padding:18px 18px 16px;min-height:200px;background:linear-gradient(160deg,rgba(255,255,255,.34),rgba(255,255,255,.12));border:1px solid rgba(255,255,255,.65);color:#fff}
.hero .tag{display:inline-block;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.7);color:#fff;font:500 .68rem/1 var(--f);text-transform:uppercase;letter-spacing:.28em;padding:6px 12px;border-radius:999px}
.hero .big{font:200 2.6rem/1 var(--f);margin:14px 0 6px;letter-spacing:-.02em;text-shadow:0 2px 16px rgba(0,0,0,.3)}
.hero .big b{font-weight:800}
.hero .sub{font-size:.88rem;color:rgba(255,255,255,.92);max-width:58%;line-height:1.38;min-height:2.7em}
.hero .kpis{margin-top:18px;position:relative;z-index:1}
.hero .face{position:absolute;right:4px;top:10px;width:130px;height:130px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.35))}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi{background:rgba(255,255,255,.72);border:1px solid var(--gline);border-radius:18px;padding:10px 8px;text-align:center;color:var(--ink);box-shadow:0 6px 16px var(--gshade)}
.kpi b{display:block;font:700 1.45rem/1.05 var(--f)}
.kpi small{display:block;font:400 .66rem var(--f);color:var(--mut);margin-top:3px;order:2}
.kpi{display:flex;flex-direction:column-reverse}
/* boletim */
.leg{display:grid;grid-template-columns:26px 1fr 80px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--edge2)}
.leg:last-child{border-bottom:0}
.leg input[type=checkbox]{width:22px;height:22px;accent-color:var(--blue)}
.leg .t{font:600 1rem/1.2 var(--f)}
.leg .g{font-size:.76rem;color:var(--mut)}
.leg .p{font:600 .8rem var(--f);color:var(--blue)}
.leg input.od{width:100%;background:#fff;border:1px solid var(--frost);border-radius:12px;padding:8px 6px;color:var(--ink);font:700 1rem var(--f);text-align:center}
.leg input.od.est{color:var(--mut2);background:rgba(255,255,255,.5);border-style:dashed}
.sum{margin-top:10px;padding:12px;border-radius:18px;background:rgba(240,240,240,.92);border:1px solid var(--frost)}
.sum .n{display:flex;justify-content:space-between;align-items:baseline}
.sum .n b{font:700 1.5rem var(--f)}
.pick{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--edge2)}
.pick:last-child{border-bottom:0}
.pick .g{font:500 .72rem var(--f);color:var(--mut);letter-spacing:.02em}
.pick .l{font:600 1.02rem/1.2 var(--f)}
.pick .o{margin-left:auto;text-align:right;font:700 1.3rem/1 var(--f);color:var(--ink)}
.pick .o small{display:block;font:500 .72rem var(--f);color:var(--pos)}
.tg{display:inline-block;padding:2px 8px;border-radius:999px;font:600 .66rem var(--f);letter-spacing:.03em;border:1px solid var(--k,var(--edge2));color:var(--k,var(--mut));background:rgba(255,255,255,.6)}
/* cartão de jogo «VS» com etiqueta recortada */
.gc{position:relative;margin:26px 0 12px;cursor:pointer;padding:22px 14px 14px;border-radius:26px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--gline);box-shadow:0 10px 30px var(--gshade),inset 0 1px 0 rgba(255,255,255,.9)}
.gc .notch{position:absolute;left:50%;top:-14px;transform:translateX(-50%);min-width:56%;max-width:86%;padding:6px 18px;text-align:center;font:500 .76rem var(--f);color:var(--ink2);background:rgba(246,246,246,.97);border:1px solid var(--gline);border-radius:0 0 16px 16px / 0 0 14px 14px;clip-path:polygon(0 0,100% 0,92% 100%,8% 100%);box-shadow:0 4px 10px var(--gshade);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc .notch .live{margin-right:6px}
.gc .hd{display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:2px}
.live{display:inline-flex;align-items:center;gap:5px;color:var(--neon);font-weight:600}
.live:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--neon);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.gc .tm{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:10px 2px 4px}
.team{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.team.r{flex-direction:column}
.team .nm{font:600 .98rem/1.1 var(--f);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.team .nm.lg{font-size:.88rem} .team .nm.xl{font-size:.78rem}
.team .rc{font:400 .72rem/1.25 var(--f);color:var(--mut);white-space:nowrap}
.logo{flex:0 0 52px;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 .82rem var(--f);color:#fff;border:3px solid #fff;box-shadow:0 6px 14px rgba(0,0,0,.28),inset 0 -6px 12px rgba(0,0,0,.18);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.logo{position:relative;overflow:hidden}
.logo img+b{visibility:hidden}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:12%;background:#fff;border-radius:50%}
.vsx{font:300 1.7rem/1 var(--f);color:var(--ink2);letter-spacing:.04em;position:relative;padding:0 6px}
.vsx:before,.vsx:after{content:"";position:absolute;top:50%;width:22px;height:1px;background:rgba(0,0,0,.25)}
.vsx:before{right:100%}.vsx:after{left:100%}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:10px 4px 2px;padding:10px 12px 8px;border-radius:18px;background:linear-gradient(180deg,#fff,rgba(255,255,255,.82));box-shadow:0 6px 16px var(--gshade)}
.board .n{font:700 1.7rem/1 var(--f);text-align:center}
.board .n small{display:block;font:400 .66rem var(--f);color:var(--mut);margin-top:3px}
.board .c{text-align:center;font:500 .74rem var(--f);color:var(--mut);min-width:84px}
.board .c b{display:block;font:600 .82rem var(--f);color:var(--ink)}
.score{text-align:center;min-width:80px;padding:0 4px}
.score .s{font:700 1.55rem/1 var(--f)}
.score .p{font:500 .68rem var(--f);color:var(--mut)}
.gc .ft{padding:8px 4px 0}
.gc .say{font-size:.88rem;line-height:1.32;margin-top:6px}
.gc .mk{font-size:.76rem;color:var(--mut);margin-top:4px}
/* folha (sobe de baixo, vidro claro) */
#sheet{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.32);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#sheet.on{display:block}
#sheet .box{position:absolute;left:0;right:0;bottom:0;top:max(5vh,env(safe-area-inset-top));overflow-y:auto;background:linear-gradient(180deg,rgba(246,251,247,.98),rgba(233,243,236,.98));border-radius:28px 28px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;box-shadow:0 -14px 40px rgba(0,0,0,.3)}
#sheet .box:before{content:"";display:block;width:44px;height:5px;border-radius:9px;background:rgba(0,0,0,.18);margin:0 auto 6px}
#sheet .box.short{top:auto;max-height:90vh}
#sheet .sh{display:flex;align-items:center;gap:8px;margin:4px 0 2px}
#sheet .sh h3{margin:0;font:500 1.35rem/1.1 var(--f);flex:1}
#sheet .x{width:42px;height:42px;border-radius:50%;border:1px solid var(--gline);background:rgba(255,255,255,.8);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px var(--gshade)}
.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th{font:500 .72rem var(--f);color:var(--mut);text-align:right;padding:6px 4px;border-bottom:1px solid var(--edge2)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--edge2)}
.tbl tr.best td{background:rgba(43,143,85,.12)}
.tbl tr.tap{cursor:pointer}
label.f{display:block;font:500 .78rem var(--f);color:var(--mut);margin:12px 0 5px}
input.in,select.in{width:100%;background:#fff;border:1px solid var(--frost);border-radius:14px;padding:11px 12px;color:var(--ink);font:600 1.05rem var(--f)}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.6);border:1px solid var(--gline)}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:9px 6px;font:500 .86rem var(--f);color:var(--ink2);cursor:pointer;min-height:42px}
.seg button.on{background:linear-gradient(180deg,var(--blue2),var(--blue));color:#fff;box-shadow:0 5px 12px rgba(0,0,0,.32)}
.opinion{margin-top:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;border-radius:18px;background:rgba(255,255,255,.75);border:1px solid var(--gline);border-left:4px solid var(--k,var(--frost))}
.opinion .face{width:52px;height:52px;flex:0 0 52px}
.opinion.good{--k:var(--pos)} .opinion.bad{--k:var(--neg)}
.form{display:inline-flex;gap:3px}
.form i{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:700 .6rem var(--f);font-style:normal}
.form .w{background:rgba(15,157,99,.16);color:var(--pos)} .form .l{background:rgba(214,51,74,.14);color:var(--neg)} .form .o{background:rgba(224,168,0,.16);color:#a37a00}
.cta{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));margin:14px -16px calc(-20px - env(safe-area-inset-bottom));padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(236,236,236,0),rgba(236,236,236,.97) 32%)}
/* contas / duelo */
.bet{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--edge2)}
.bet:last-child{border-bottom:0}
.bet .who{width:32px;height:32px;flex:0 0 32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--k)}
.bet .m{flex:1;min-width:0}
.bet .t{font:600 .98rem/1.2 var(--f)}
.bet .g{font-size:.76rem;color:var(--mut)}
.bet .legs{font-size:.78rem;color:var(--ink2);margin-top:3px;line-height:1.38}
.bet .v{text-align:right;font:700 1.02rem/1.15 var(--f);white-space:nowrap}
.bet .v small{display:block;font:400 .72rem var(--f);color:var(--mut)}

<body>
<header class="top">

<div id="toast"></div>

<script>
'use strict';
/* =====================================================================
   MISTER BOSS — o filtro final.
   Não tem modelo próprio de jogos: lê o trabalho de todos os Misters que
   vivem neste telemóvel (Tó, Vi, Gi, Lu, Ko e Zé), compara o que cada um
   promete com o que acontece, corta as zonas onde falham e monta o
   «Boletim do Boss» com o melhor do dia de todos os desportos.
   Não mexe em nenhum Mister: só lê o que eles guardam.
   ===================================================================== */
const APP_VER = '1.4.0';

/* ---------- utilitários ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const r2 = x => Math.round(x * 100) / 100;
const r3 = x => Math.round(x * 1000) / 1000;
const LS = {
  get(k, d) { try { const v = localStorage.getItem('boss_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('boss_' + k, JSON.stringify(v)); return true; } catch (e) { toast('⚠️ A memória do telemóvel está cheia'); return false; } }
};
const RAW = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const pct = v => Math.round(v * 100) + '%';
const sPts = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(Math.round(v * 100)) + ' pts';
const odd2 = v => v ? Number(v).toFixed(2).replace('.', ',') : '—';
const num = x => { const v = parseFloat(String(x == null ? '' : x).replace(',', '.').replace(/[^\d.+-]/g, '')); return isFinite(v) ? v : null; };
function toast(msg, ms) { const t = $('#toast'); if (!t) return; t.innerHTML = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms || 2800); }
const hhmm = iso => new Date(iso).toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
const dayLbl = iso => new Date(iso).toLocaleDateString('pt-PT', { weekday: 'short', day: '2-digit', month: '2-digit' }).replace('.', '');
const ymd = d => { const x = new Date(d); return x.getFullYear() + String(x.getMonth() + 1).padStart(2, '0') + String(x.getDate()).padStart(2, '0'); };
const DAY_CUT = 6;   // jogos entre as 00:00 e as 05:59 (NBA, NHL, NFL, UFC à noite) contam para o dia anterior
const dayOf = iso => ymd(new Date(iso).getTime() - DAY_CUT * 3600e3);
const dayKey = off => ymd(Date.now() - DAY_CUT * 3600e3 + (off || 0) * 864e5);
const dayName = off => off === 0 ? 'Hoje' : off === 1 ? 'Amanhã' : off === -1 ? 'Ontem' : '';
const dayDate = k => new Date(+k.slice(0, 4), +k.slice(4, 6) - 1, +k.slice(6, 8), 12).toLocaleDateString('pt-PT', { weekday: 'short', day: '2-digit', month: '2-digit' }).replace('.', '');
const ago = t => { if (!t) return 'nunca'; const m = Math.round((Date.now() - t) / 60000); return m < 60 ? `há ${m} min` : m < 48 * 60 ? `há ${Math.round(m / 60)} h` : `há ${Math.round(m / 1440)} dias`; };

/* ---------- os Misters (todos no mesmo site: juliomcm-tech.github.io/…) ---------- */
const MISTERS = [
  { k: 'ze', n: 'Mister Zé', s: 'Futebol', c: '#1f7a3f', ini: 'Zé', path: '../mister-ze/', run: false },
  { k: 'to', n: 'Mister Tó', s: 'Basquetebol · NBA', c: '#d9480f', ini: 'Tó', path: '../mister-to/', run: true },
  { k: 'vi', n: 'Mister Vi', s: 'Ténis · ATP/WTA', c: '#f08c00', ini: 'Vi', path: '../mister-vi/', run: true },
  { k: 'gi', n: 'Mister Gi', s: 'Hóquei · NHL', c: '#1c7ed6', ini: 'Gi', path: '../mister-gi/', run: true },
  { k: 'lu', n: 'Mister Lu', s: 'Futebol americano · NFL', c: '#343a40', ini: 'Lu', path: '../mister-lu/', run: true },
  { k: 'ko', n: 'Mister Ko', s: 'MMA · UFC', c: '#c92a2a', ini: 'Ko', path: '../mister-ko/', run: true }
];
const MI = Object.fromEntries(MISTERS.map(m => [m.k, m]));
let CFG = Object.assign({ target: 0.75, maxLegs: 5, perMister: 2, minLeg: 0.85, off: {} }, LS.get('cfg', {}));

/* ---------- Mister Zé: só lê o diário e o registo do boletim seguro (nada é alterado) ---------- */
const ZE_SAFE = ['1X', 'X2', '12', 'O1.5', 'U3.5', '1', '2'];
const ZE_COND = { '1': (i, j) => i > j, 'X': (i, j) => i === j, '2': (i, j) => i < j, '1X': (i, j) => i >= j, 'X2': (i, j) => i <= j, '12': (i, j) => i !== j, 'O1.5': (i, j) => i + j > 1.5, 'U3.5': (i, j) => i + j < 3.5, 'O2.5': (i, j) => i + j > 2.5 };
const zeLabel = (k, h, a) => ({ '1': h + ' ganha', '2': a + ' ganha', 'X': 'Empate', '1X': h + ' ou empate', 'X2': a + ' ou empate', '12': 'Não há empate', 'O1.5': 'Mais de 1,5 golos', 'U3.5': 'Menos de 3,5 golos' }[k] || k);
const zeFam = k => /^[12X]$/.test(k) ? 'Resultado (1X2)' : k.length === 2 ? 'Dupla hipótese' : 'Golos';
const zeRes = r => { const m = String(r || '').match(/(\d+)\s*[-–:]\s*(\d+)/); return m ? [+m[1], +m[2]] : null; };
function zeFeed() {
  const D = RAW('ze_diary_v1'), S = RAW('ze_safe_slip_v1');
  if (!D && !S) return null;
  const legs = {}; let tmax = 0;
  Object.values((D && D.items) || {}).forEach(it => {
    if (!it.mk || !it.kick || it.backfill) return;
    const res = zeRes(it.res); tmax = Math.max(tmax, it.t || 0);
    ZE_SAFE.forEach(k => {
      const p = it.mk[k]; if (!(p >= 0.80 && p <= 0.985)) return;
      const id = 'ze|' + it.key + '|' + k;
      legs[id] = { id, g: it.key, gl: it.home + ' – ' + it.away, d: it.kick, mk: k, mkn: zeFam(k), lb: zeLabel(k, it.home, it.away), p: r3(p), odd: null, est: true, seg: { lg: it.league || '—' }, st: res ? (ZE_COND[k](res[0], res[1]) ? 'won' : 'lost') : 'open', t: it.t || 0 };
    });
  });
  Object.values((S && S.legs) || {}).forEach(l => {   // o boletim seguro do próprio Zé (também conta para a história dele)
    const id = 'zes|' + l.ev + '|' + l.k; if (legs[id]) return;
    legs[id] = { id, g: 'ev' + l.ev, gl: (l.h || '') + ' – ' + (l.a || ''), d: new Date(l.d || 0).toISOString(), mk: l.k, mkn: zeFam(l.k), lb: zeLabel(l.k, l.h, l.a), p: l.p, odd: null, est: true, seg: { lg: l.lg || '—' }, st: l.w == null ? 'open' : l.w ? 'won' : 'lost', t: l.d || 0, safeZe: 1 };
    tmax = Math.max(tmax, l.d || 0);
  });
  return { app: 'ze', name: 'Mister Zé', sport: 'Futebol', t: tmax, legs };
}
/* ---------- ler as fichas + o arquivo do Boss ---------- */
function feeds() {
  const out = {};
  MISTERS.forEach(M => { const F = M.k === 'ze' ? zeFeed() : RAW(M.k + '_boss'); if (F && F.legs) out[M.k] = F; });
  return archive(out);
}
/* o Boss guarda no seu arquivo cada seleção já decidida (até 3000): assim as estatísticas não se perdem quando
   um Mister limpa a ficha dele, e ficam a crescer com o tempo */
function archive(F) {
  const H = LS.get('hist', {}); let ch = false;
  Object.entries(F).forEach(([mi, f]) => Object.values(f.legs).forEach(l => {
    if (l.st === 'open') return; const k = mi + '|' + l.id;
    if (!H[k]) { H[k] = { mi, id: l.id, p: l.p, st: l.st, mkn: l.mkn, seg: l.seg, d: l.d, val: l.val != null ? l.val : undefined, z: l.safeZe ? 1 : undefined }; ch = true; }
  }));
  const ks = Object.keys(H); if (ks.length > 3000) { ks.sort((a, b) => H[a].d < H[b].d ? -1 : 1).slice(0, ks.length - 3000).forEach(k => delete H[k]); ch = true; }
  if (ch) LS.set('hist', H);
  Object.values(H).forEach(h => {
    if (!MI[h.mi]) return;
    const f = F[h.mi] || (F[h.mi] = { app: h.mi, name: MI[h.mi].n, t: 0, legs: {}, arch: true });
    if (!f.legs[h.id]) f.legs[h.id] = { id: h.id, p: h.p, st: h.st, mkn: h.mkn, seg: h.seg, d: h.d, val: h.val, safeZe: h.z, lb: '', gl: '', arch: 1 };
  });
  return F;
}
function lsUse() { const by = {}; let tot = 0; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i), n = (k.length + (localStorage.getItem(k) || '').length) * 2; tot += n; const p = (k.match(/^([a-z]+)_/) || [, 'outros'])[1]; by[p] = (by[p] || 0) + n; } } catch (e) {} return { tot, by }; }
const archCount = () => Object.keys(LS.get('hist', {})).length;
const segKey = s => !s ? '—' : [s.lg, s.cat].filter(Boolean).join(' · ');
const graded = l => l.st === 'won' || l.st === 'lost';

/* =====================================================================
   O FILTRO SOBRE O FILTRO
   Para cada Mister, cada tipo de aposta e cada liga/torneio/categoria:
   quantas seleções prometeu (soma das probabilidades) e quantas acertou.
   Fiabilidade = (acertos + 25) ÷ (prometido + 25): começa em 1 (confia no
   Mister) e só se afasta quando há resultados que cheguem.
   Usa o nível mais fino com 15+ seleções decididas; corta as zonas fracas
   (25+ decididas e a falhar 6+ pontos abaixo do que prometem).
   ===================================================================== */
const PRIOR = 25, MIN_LEVEL = 15, WEAK_N = 25, WEAK_GAP = 0.06;
function groupStats(F) {
  const G = {};
  const add = (key, l) => { const g = G[key] = G[key] || { n: 0, w: 0, P: 0 }; g.n++; g.P += l.p; if (l.st === 'won') g.w++; };
  Object.entries(F).forEach(([mk, f]) => Object.values(f.legs).forEach(l => {
    if (!graded(l)) return;
    add(mk, l); add(mk + '|' + l.mkn, l); add(mk + '|' + l.mkn + '|' + segKey(l.seg), l);
  }));
  return G;
}
function judge(G, mk, l) {
  const keys = [mk + '|' + l.mkn + '|' + segKey(l.seg), mk + '|' + l.mkn, mk];
  let used = null;
  for (const k of keys) { const g = G[k]; if (g && g.n >= MIN_LEVEL) { used = { k, g }; break; } }
  const g = used ? used.g : { n: 0, w: 0, P: 0 };
  const r = clamp((g.w + PRIOR) / (g.P + PRIOR), 0.8, 1.03);   // para cima, no máximo +3%: confiança a mais é o erro mais caro
  const fine = G[keys[0]];
  const weak = fine && fine.n >= WEAK_N && fine.w / fine.n < fine.P / fine.n - WEAK_GAP;
  return { r, n: g.n, lvl: used ? used.k.split('|').length : 0, weak, pb: Math.min(0.985, l.p * r) };
}
/* candidatos de um dia: seleções por decidir desse dia (que ainda não começaram) */
const STALE_H = 18;
const staleF = f => !!(f && f.t && Date.now() - f.t > STALE_H * 3600e3);
function dayCands(F, G, key) {
  const now = Date.now(), out = [];
  Object.entries(F).forEach(([mk, f]) => {
    if (CFG.off[mk]) return;
    Object.values(f.legs).forEach(l => {
      if (l.st !== 'open' || l.safeZe) return;
      const t0 = new Date(l.d).getTime(); if (!(t0 > now + 10 * 60e3) || dayOf(l.d) !== key) return;
      const J = judge(G, mk, l), old = f.t && now - f.t > STALE_H * 3600e3;
      out.push(Object.assign({}, l, J, { mi: mk, M: MI[mk], why: old ? `dados do ${MI[mk].n} com mais de ${STALE_H} h: toca em ↻ para atualizar` : J.weak ? 'zona fraca: este Mister falha aqui mais do que promete' : J.pb < CFG.minLeg ? `abaixo de ${pct(CFG.minLeg)} depois do filtro` : null }));
    });
  });
  return out.sort((a, b) => b.pb - a.pb);
}
/* o boletim: 1 seleção por jogo, no máximo 2 por Mister, junta enquanto a promessa (com 1 ponto de folga por seleção) fica ≥ alvo */
function buildSlip(C) {
  const byGame = {}, per = {}, legs = []; let P = 1;
  C.filter(c => !c.why).forEach(c => {
    c.out = null;
    const gk = c.mi + '|' + c.g; if (byGame[gk]) { c.out = 'já há outra seleção deste jogo no boletim'; return; }
    if ((per[c.mi] || 0) >= CFG.perMister) { c.out = `já há ${CFG.perMister} do ${MI[c.mi].n} (para não depender só de um)`; return; }
    if (legs.length >= CFG.maxLegs) { c.out = `o boletim já tem ${CFG.maxLegs} seleções`; return; }

let BUSY = false;
function runMister(M, onStep) {
  return new Promise(resolve => {
    const fr = document.createElement('iframe');
    fr.style.cssText = 'position:fixed;width:390px;height:700px;left:-2000px;top:0;opacity:0;pointer-events:none;border:0';
    fr.setAttribute('aria-hidden', 'true');
    let done = false, t0 = Date.now();
    const finish = (ok, msg) => { if (done) return; done = true; clearInterval(iv); setTimeout(() => fr.remove(), 300); resolve({ ok, msg }); };
    const iv = setInterval(async () => {
      if (Date.now() - t0 > 150000) return finish(false, 'demorou demais');
      let w; try { w = fr.contentWindow; if (!w || !w.document || w.document.readyState !== 'complete') return; } catch (e) { return finish(false, 'sem acesso'); }
      if (fr._started) return;
      let ready = false;
      try { ready = typeof w.refresh === 'function' && w.eval("typeof SEED === 'undefined' || !!SEED"); } catch (e) {}
      if (!ready) return;
      fr._started = true; onStep && onStep('a atualizar');
      try { await w.refresh(); try { w.bossFeed && w.bossFeed(); } catch (e) {} finish(true, 'ok'); } catch (e) { finish(false, e && e.message || 'falhou'); }
    }, 400);
    fr.onerror = () => finish(false, 'não abriu');
    fr.src = M.path + 'index.html?boss=1';
    document.body.appendChild(fr);
  });
}
async function refreshAll() {
  if (BUSY) return; BUSY = true; document.body.classList.add('busy');
  const btn = $('#btnRefresh'); if (btn) btn.classList.add('spin');
  const res = {};
  try {
    for (const M of MISTERS.filter(m => m.run && !CFG.off[m.k])) {
      setUpd(`⏳ ${M.n}: a abrir…`);
      const r = await runMister(M, s => setUpd(`⏳ ${M.n}: ${s}…`));
      res[M.k] = r; LS.set('run_' + M.k, { t: Date.now(), ok: r.ok, msg: r.msg });
    }
    LS.set('last', Date.now());
    compute();
    const ok = Object.values(res).filter(r => r.ok).length, n = Object.keys(res).length;
    toast(`Atualizado: ${ok} de ${n} Misters${ok < n ? ' (vê em «Misters» quais falharam)' : ''} · hoje ${STATE.D[0].C.length} seleções, amanhã ${STATE.D[1].C.length}`, 4500);

  const by = (fn) => { const o = {}; L.forEach(l => { const k = fn(l); const g = o[k] = o[k] || { n: 0, w: 0, P: 0 }; g.n++; g.P += l.p; if (l.st === 'won') g.w++; }); return o; };
  const bucket = l => l.p < 0.85 ? '80-85%' : l.p < 0.9 ? '85-90%' : l.p < 0.95 ? '90-95%' : '95%+';

function viewStats() {
  const S = STATE, B = bossStats(S.F);
  let h = `<div class="dates" style="margin-top:14px"><button class="${SM === 'boss' ? 'on' : ''}" onclick="SM='boss';render()"><b>Boss</b><small>filtro</small></button>${MISTERS.map(M => `<button class="${SM === M.k ? 'on' : ''}" onclick="SM='${M.k}';render()"><b>${esc(M.ini)}</b><small>${S.F[M.k] ? misterStats(S.F, M.k).n : 0}</small></button>`).join('')}</div>`;
  if (SM === 'boss') {
    h += `<div class="pn hl">${pnH(`${ic('shield')} Boletins do Boss`, B.slips ? B.slips + ' decididos' : '')}
      ${B.slips ? attr('Boletins inteiros certos', B.won / B.slips * 100, 'var(--c-blue)', `${B.won}/${B.slips} · prometia ${pct(B.prom)}`) : '<div class="small muted">Ainda nenhum boletim decidido. O Boss guarda o boletim de cada dia antes do 1.º jogo.</div>'}
      ${B.played ? attr('Boletins que jogaste certos', B.playedW / B.played * 100, 'var(--c-orange, #e08a1e)', `${B.playedW}/${B.played} · prometia ${pct(B.playedP)}`) : ''}
      ${B.legs ? attr('Seleções certas', B.legW / B.legs * 100, 'var(--c-green)', `${B.legW}/${B.legs} · prometia ${pct(B.legP)}`) : ''}
      <div class="why"><span>Arquivo do Boss (seleções decididas guardadas)</span><b>${archCount()}</b></div>
      <div class="why"><span>Boletins guardados</span><b>${Object.keys(SLIPS).length}</b></div></div>
      <div class="pn">${pnH(`${ic('filter')} O filtro tinha razão?`, B.cuts ? B.cuts + ' cortes decididos' : '')}
      ${B.cuts ? `${attr('Cortadas que falharam mesmo', B.cutLost / B.cuts * 100, 'var(--c-red)', `${B.cutLost}/${B.cuts}`)}<div class="small muted">Os Misters davam-lhes ${pct(B.cutP)} em média; ${B.cutLost / B.cuts > 1 - B.cutP ? '<b class="pos">falharam mais do que isso: o corte ajudou.</b>' : 'falharam menos do que isso: por agora o corte não ajudou (precisa de mais resultados).'}</div>` : '<div class="small muted">Quando houver cortes decididos, mostro se o Boss tinha razão em cortá-los.</div>'}</div>`;
    h += `<div class="pn">${pnH(`${ic('users')} Cada Mister (seleções de 80%+)`, '')}${MISTERS.map(M => { const s = S.F[M.k] ? misterStats(S.F, M.k) : null; return `<div class="mrow" onclick="SM='${M.k}';render()">${mdot(M)}<div style="flex:1;min-width:0"><b>${esc(M.n)}</b><div class="small muted">${esc(M.s)}</div></div><div style="text-align:right">${s && s.n ? `<b>${pct(s.hit)}</b> <span class="small muted">de ${s.n}</span><div class="small gap ${gapCls(s.gap)}">prometia ${pct(s.prom)}</div>` : '<span class="small muted">sem dados</span>'}</div></div>`; }).join('')}</div>`;
    return h;
  }
  const M = MI[SM], s = S.F[SM] ? misterStats(S.F, SM) : null;
  h += `<div class="pn hl">${pnH(`${mdot(M, 30)} ${esc(M.n)}`, esc(M.s))}`;
  if (!s || !s.n) return h + `<div class="small muted">${S.F[SM] ? 'Ainda sem seleções decididas.' : 'Este Mister ainda não deixou dados neste telemóvel.'}</div></div>`;
  h += attr('Seleções de 80%+ certas', s.hit * 100, 'var(--c-blue)', `${s.w}/${s.n} · prometia ${pct(s.prom)}`) + `<div class="why"><span>Diferença (acertou − prometeu)</span><b class="gap ${gapCls(s.gap)}">${sPts(s.gap)}</b></div><div class="why"><span>Por decidir</span><b>${s.open}</b></div></div>`;
  h += `<div class="pn">${pnH(`${ic('target')} Quando diz X%, acontece…`, '')}${calTable(s.bk, 'Confiança')}</div>`;
  h += `<div class="pn">${pnH(`${ic('list')} Por tipo de aposta`, '')}${calTable(s.mk, 'Aposta')}</div>`;
  h += `<div class="pn">${pnH(`${ic('chart')} Por liga / torneio / categoria`, '')}${calTable(s.seg, 'Onde') || '<div class="small muted">Precisa de 3+ seleções por grupo.</div>'}</div>`;
  h += `<div class="pn">${pnH(`${ic('filter')} Tipo de aposta × onde`, '')}${calTable(s.mseg, 'Grupo') || '<div class="small muted">Precisa de 3+ seleções por grupo.</div>'}</div>`;
  if (s.val.length) { const w = s.val.filter(l => l.st === 'won').length; h += `<div class="pn">${pnH(`${ic('gem')} Apostas de valor`, '')}<div class="why"><span>Certas</span><b>${w}/${s.val.length}</b></div></div>`; }
  return h + `<div class="small muted" style="margin:6px 4px">Verde = acerta o que promete (ou mais). Vermelho = promete mais do que acerta. Com menos de ~30 seleções num grupo, a diferença ainda pode ser sorte.</div>`;
}
/* ---------- MISTERS: estado de cada um e o feedback do Boss ---------- */
const fbRow = f => `<div class="frow">${mchip(MI[f.mk])} <b>${esc(MI[f.mk].n)}</b> ${f.gap < 0 ? 'promete' : 'é prudente demais em'} <b>${esc(f.k)}</b>: diz ${pct(f.prom)}, acerta ${pct(f.hit)} <span class="gap ${gapCls(f.gap)}">(${sPts(f.gap)})</span> <span class="muted small">em ${f.n} seleções${f.strong ? ' · o Boss já corta esta zona' : f.gap < 0 ? ' · a vigiar' : ''}</span></div>`;
function viewMisters() {
  const S = STATE, fb = feedback(S.F);
  let h = `<div class="pn hl" style="margin-top:14px">${pnH(`${ic('users')} Os Misters neste telemóvel`, '')}` + MISTERS.map(M => {
    const f = S.F[M.k], st = f ? misterStats(S.F, M.k) : null, run = LS.get('run_' + M.k, null);
    return `<div class="mrow">${mdot(M)}<div style="flex:1;min-width:0"><b>${esc(M.n)}</b> <span class="small muted">${esc(M.s)}</span>
      <div class="small muted">${f ? `dados ${ago(f.t)} · ${st.open} por decidir · ${st.n} decididas` : 'ainda sem dados aqui'}${run && !run.ok ? ` · <span class="neg">última atualização falhou (${esc(run.msg)})</span>` : ''}${M.k === 'ze' ? ' · só leitura' : ''}</div></div>
      <a class="btn sm" href="${M.path}" target="_blank" rel="noopener">${ic('open')}</a></div>`;
  }).join('') + `<div class="small muted" style="margin-top:8px">O ↻ do Boss põe o Tó, o Vi, o Gi, o Lu e o Ko a atualizar (não precisas de os abrir). O Zé é só lido: abre-o e atualiza-o como sempre.</div></div>`;
  h += `<div class="pn">${pnH(`${ic('bulb')} Feedback do Boss`, fb.length ? fb.length + ' notas' : '')}${fb.length ? fb.map(fbRow).join('') : '<div class="small muted">Ainda não há resultados suficientes (15+ seleções decididas no mesmo tipo de aposta e liga) para dar feedback com confiança.</div>'}
    <button class="btn go full" style="margin-top:10px" onclick="copyReport()">${ic('copy')} Copiar relatório para afinar os Misters</button>
    <div class="small muted" style="margin-top:6px">Cola o relatório numa conversa com o Claude: com ele dá para corrigir o Mister certo no sítio certo. O Boss nunca mexe nos Misters sozinho.</div></div>`;
  return h;
}
function reportText() {
  const S = STATE, L = [`MISTER BOSS · relatório ${new Date().toLocaleString('pt-PT')} · v${APP_VER}`];
  MISTERS.forEach(M => { const s = S.F[M.k] ? misterStats(S.F, M.k) : null; L.push(`${M.n}: ${s && s.n ? `${s.w}/${s.n} certas (${pct(s.hit)}) · prometia ${pct(s.prom)} · ${sPts(s.gap)}` : 'sem dados'}`); if (s && s.n) Object.entries(s.mk).filter(([, g]) => g.n >= 5).forEach(([k, g]) => L.push(`  · ${k}: ${g.w}/${g.n} · prometia ${pct(g.P / g.n)}`)); });
  L.push('Zonas com diferença ≥4 pts (15+ seleções):'); feedback(S.F).forEach(f => L.push(`  · ${MI[f.mk].n} · ${f.k}: diz ${pct(f.prom)}, acerta ${pct(f.hit)} (${sPts(f.gap)}, n=${f.n})`));
  const B = bossStats(S.F); L.push(`Boss: boletins ${B.won}/${B.slips} · seleções ${B.legW}/${B.legs} · cortes decididos ${B.cuts} (falharam ${B.cutLost})`);
  return L.join('\n');
}
async function copyReport() { const t = reportText(); try { await navigator.clipboard.writeText(t); toast('Relatório copiado'); } catch (e) { openSheet('Relatório', `<textarea class="in" style="min-height:300px;font-size:.8rem">${esc(t)}</textarea>`); } }
/* ---------- MAIS ---------- */
function openSheet(title, html, short) { const b = $('#sheetBox'); b.className = 'box' + (short ? ' short' : ''); b.innerHTML = `<div class="sh"><h3>${title}</h3><button class="x" onclick="closeSheet()" aria-label="Fechar">${ic('x')}</button></div>${html}`; $('#sheet').classList.add('on'); b.scrollTop = 0; }
function closeSheet() { $('#sheet').classList.remove('on'); }
function spaceBlock() {
  const U = lsUse(), cap = 5 * 1024 * 1024, kb = n => n < 1024 * 1024 ? Math.round(n / 1024) + ' KB' : (n / 1048576).toFixed(1).replace('.', ',') + ' MB';
  const nm = { to: 'Tó', vi: 'Vi', gi: 'Gi', lu: 'Lu', ko: 'Ko', boss: 'Boss', ze: 'Zé' }, f = U.tot / cap;
  return `<div class="pn">${pnH(`${ic('save')} Espaço dos Misters neste telemóvel`, kb(U.tot) + ' de ~5 MB')}
    ${attr('Ocupado', Math.min(100, f * 100), f > 0.8 ? 'var(--c-red)' : 'var(--c-green)', pct(f))}
    ${Object.entries(U.by).sort((a, b) => b[1] - a[1]).map(([p, n]) => `<div class="why"><span>${esc(nm[p] || p)}</span><b class="muted">${kb(n)}</b></div>`).join('')}
    <div class="small muted" style="margin-top:6px">Todos os Misters do site partilham este espaço do navegador. ${f > 0.8 ? '<b class="neg">Está quase cheio: faz uma cópia de segurança.</b>' : 'Está tudo bem.'}</div></div>`;
}
function viewMais() {
  const T = [['info', 'Como pensa o Boss', 'openHow()'], ['gear', 'Definições', 'openCfg()'], ['save', 'Cópia de segurança', 'openBackup()'], ['copy', 'Relatório', 'copyReport()']];
  if (!isStandalone()) T.push(['phone', 'Instalar app', 'openInstall()']);
  return `<div class="tiles" style="margin-top:14px">${T.map(([i, l, f]) => `<div class="tile" onclick="${f}">${ic(i)}<b>${l}</b></div>`).join('')}</div>
   ${spaceBlock()}
   <div class="pn small muted" style="text-align:center">Mister Boss v${APP_VER} · lê os Misters deste telemóvel<br>Simulação: sem dinheiro real e sem ligação à Betano. +18 · Joga com responsabilidade.<br>© 2026 Júlio Melo</div>`;
}
function openHow() {
  openSheet('Como pensa o Boss', `<div class="pn" style="line-height:1.55">
   ${catH('users', '1. Junta os Misters', 'var(--c-blue)')}<p>Cada Mister, quando atualiza, deixa neste telemóvel uma ficha com as seleções do dia que passam dos 80% e confere as antigas com o seu próprio código. O Zé é lido no diário dele. O Boss não tem modelo de jogos: o trabalho é dos Misters.</p>
   ${catH('filter', '2. O filtro sobre o filtro', 'var(--c-blue)')}<p>Para cada Mister, cada tipo de aposta e cada liga ou torneio, o Boss soma o que foi prometido e o que aconteceu. A probabilidade do Mister é corrigida por essa história: <b>fiabilidade = (acertos + ${PRIOR}) ÷ (prometido + ${PRIOR})</b>. No início vale 1 (confia no Mister); só se mexe quando há resultados. Zonas com ${WEAK_N}+ seleções a falhar ${Math.round(WEAK_GAP * 100)}+ pontos abaixo do prometido são cortadas.</p>
   ${catH('shield', '3. O Boletim do Boss', 'var(--c-blue)')}<p>Uma seleção por jogo, no máximo ${CFG.perMister} por Mister, só acima de ${pct(CFG.minLeg)} depois do filtro, juntas enquanto a promessa (com 1 ponto de folga por seleção) fica acima de ${pct(CFG.target)}. Jogos de desportos diferentes não se influenciam, por isso a conta do boletim é honesta.</p>
   ${catH('bulb', '4. Feedback', 'var(--c-blue)')}<p>Onde um Mister promete mais do que acerta (ou é prudente demais), o Boss avisa. O relatório serve para afinar esse Mister. O Boss nunca muda nada sozinho.</p>
   ${catH('warn', 'Honestidade', 'var(--c-red)')}<p>O Boss não cria vantagem sobre a casa: torna o boletim mais fiável e tira as zonas fracas. Precisa de tempo: com 1-2 meses de atualizações diárias começa a ver padrões a sério.</p></div>`);
}
function openCfg() {
  const inp = (id, lbl, v, hint) => `<label class="f">${lbl}</label><input class="in" id="${id}" inputmode="decimal" value="${String(v).replace('.', ',')}">${hint ? `<div class="small muted">${hint}</div>` : ''}`;
  openSheet('Definições', `${inp('c_t', 'Promessa mínima do boletim (%)', Math.round(CFG.target * 100), 'Mais alto = menos seleções, mais seguro.')}
   ${inp('c_l', 'Probabilidade mínima de cada seleção (%)', Math.round(CFG.minLeg * 100))}${inp('c_n', 'Máximo de seleções', CFG.maxLegs)}${inp('c_p', 'Máximo por Mister', CFG.perMister)}
   <label class="f">Misters que entram</label>${MISTERS.map(M => `<label class="why" style="cursor:pointer"><span>${mchip(M)} ${esc(M.n)}</span><input type="checkbox" id="c_on_${M.k}" ${CFG.off[M.k] ? '' : 'checked'}></label>`).join('')}
   <button class="btn fill full" style="margin-top:14px" onclick="saveCfg()">Guardar</button>`);
}
function saveCfg() {
  const v = id => num($('#' + id).value);
  if (v('c_t') > 0) CFG.target = clamp(v('c_t'), 50, 95) / 100; if (v('c_l') > 0) CFG.minLeg = clamp(v('c_l'), 70, 97) / 100;
  if (v('c_n') > 0) CFG.maxLegs = clamp(Math.round(v('c_n')), 1, 8); if (v('c_p') > 0) CFG.perMister = clamp(Math.round(v('c_p')), 1, 5);
  MISTERS.forEach(M => { CFG.off[M.k] = !$('#c_on_' + M.k).checked; });
  LS.set('cfg', CFG); closeSheet(); compute(); render(); toast('Guardado');
}
function openBackup() {
  openSheet('Cópia de segurança', `<p class="small">Guarda os boletins e o registo do Boss num ficheiro. Os dados de cada Mister guardam-se na cópia de segurança de cada um.</p>
   <button class="btn fill full" onclick="exportAll()">${ic('download')} Exportar</button>
   <label class="f" style="margin-top:14px">Importar</label><input type="file" accept=".json" class="in" onchange="importAll(this)">`, true);
}
function exportAll() { const data = { cfg: CFG, slips: SLIPS, cuts: CUTS }; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: 'mister-boss', ver: APP_VER, t: Date.now(), data })], { type: 'application/json' })); a.download = 'mister-boss-copia-' + ymd(Date.now()) + '.json'; document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 1000); }
function importAll(inp) { const f = inp.files && inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const j = JSON.parse(r.result); if (j.app !== 'mister-boss') throw new Error('não é uma cópia do Mister Boss'); LS.set('cfg', j.data.cfg); LS.set('slips', j.data.slips); LS.set('cuts', j.data.cuts); toast('Importado'); setTimeout(() => location.reload(), 600); } catch (e) { toast(esc(e.message)); } }; r.readAsText(f); }
/* ---------- instalar ---------- */
let DEFER_INSTALL = null;
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); DEFER_INSTALL = e; if (VIEW === 'inicio') render(); });
function installBanner() { if (isStandalone() || LS.get('instHide', 0)) return ''; return `<div class="pn inst"><span style="color:var(--blue)">${ic('phone')}</span><div class="t"><b>Instala o Mister Boss</b><small>Fica no ecrã do telemóvel, como uma app.</small></div><button class="btn fill sm" onclick="doInstall()">Instalar</button><button class="x" onclick="LS.set('instHide',1);render()" aria-label="Fechar">${ic('x')}</button></div>`; }
async function doInstall() { if (DEFER_INSTALL) { DEFER_INSTALL.prompt(); try { const r = await DEFER_INSTALL.userChoice; if (r && r.outcome === 'accepted') LS.set('instHide', 1); } catch (e) {} DEFER_INSTALL = null; render(); return; } openInstall(); }
function openInstall() { openSheet('Instalar como app', `<div class="pn"><b>Android (Chrome):</b> toca nos <b>⋮</b> e escolhe <b>«Instalar app»</b>.<br><br><b>iPhone:</b> no Safari, <b>Partilhar → «Adicionar ao ecrã principal»</b>. Atenção: no iPhone cada app instalada guarda os dados à parte; usa o Boss e os Misters no Safari para eles se verem.</div>`, true); }
/* ---------- arranque ---------- */
$('#topFace').innerHTML = bossFace('ok');
$('#btnRefresh').innerHTML = ic('refresh');
$('#btnRefresh').onclick = refreshAll;
document.querySelectorAll('[data-ic]').forEach(el => { el.outerHTML = ic(el.dataset.ic); });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS.includes(v) && v !== VIEW) { VIEW = v; render(); } });
window.addEventListener('focus', () => { if (!BUSY) { compute(); render(); } });   // voltar de um Mister: lê outra vez
compute(); render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

</script>
</body>
</html>
